<style>
  /* --- CSS CHO MODAL UPLOAD MINH CHỨNG - BẢN NÂNG CẤP --- */
  #khung_tai_tl { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1080; justify-content: center; align-items: center; backdrop-filter: blur(3px); }
  .up-container { background: #fff; padding: 20px; border-radius: 12px; width: 600px; max-width: 95%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); font-family: "Times New Roman", serif; animation: popIn 0.3s ease; }
  .up-header { text-align: center; border-bottom: 2px solid #1e3a8a; margin-bottom: 15px; padding-bottom: 5px; }
  .up-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .up-dropzone { border: 2px dashed #3b82f6; padding: 25px; text-align: center; background: white; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .up-dropzone:hover { border-color: #0891b2; background: #f0f9ff; }
  
  #btnTaiLen { width: 100%; padding: 12px; background: #0891b2; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; opacity: 0.5; pointer-events: none; margin-top: 10px; font-family: "Times New Roman", serif; font-size: 15px; }
  #btnTaiLen.active { opacity: 1; pointer-events: auto; }
  
  .close-up { width: 100%; padding: 10px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; font-family: "Times New Roman", serif; font-size: 15px; }
  .close-up:hover { background: #475569; }
  
  .btn-create-folder { border: 1px solid #ccc; background: #f0fdf4; color: #16a34a; width: 40px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 18px; margin-left: 5px; }
  #canhBaoXoa { display:none; color:#d97706; font-size:14px; text-align:center; margin-bottom:10px; font-weight:bold; background: #fffbeb; padding: 8px; border-radius: 6px; border: 1px dashed #d97706; }
</style>

<div id="khung_tai_tl">
  <div class="up-container">
    <div class="up-header"><h2 style="margin:0; color:#1e3a8a;">📁 ĐÍNH KÈM TÀI LIỆU</h2></div>
    
    <div class="up-box">
       <label><b>1. Thư mục lưu trữ:</b></label>
       <div style="display:flex; gap:5px; margin-top:5px;">
           <select id="hopThuMuc" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px; font-family: 'Times New Roman', serif; font-size: 15px;"><option>⏳ Đang quét...</option></select>
           <button class="btn-create-folder" onclick="toggleNewFolderUI()" title="Tạo thư mục con mới">➕</button>
       </div>
       <div id="newFolderArea" style="display:none; margin-top:8px; background:#f9fafb; padding:10px; border:1px solid #e5e7eb; border-radius:4px;">
           <label style="font-size:13px; font-weight:bold; color:#065f46;">Tên thư mục mới:</label>
           <div style="display:flex; gap:5px; margin-top:5px;">
               <input type="text" id="txtNewFolderName" placeholder="Ví dụ: Tài liệu 2026" style="flex:1; padding:6px; border:1px solid #ccc; border-radius:4px;">
               <button onclick="doCreateNewFolder()" style="background:#059669; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer;">Tạo</button>
           </div>
       </div>
    </div>

    <div class="up-box">
      <label style="display:block; margin-bottom:5px;"><b>2. Phương thức đính kèm:</b></label>
      <div style="display:flex; gap:15px; justify-content:center; margin-bottom:10px; font-weight:bold; flex-wrap: wrap;">
        <label><input type="radio" name="cheDoTai" value="file" checked onchange="toggleUpMode()"> 📄 Tải File lẻ</label>
        <label><input type="radio" name="cheDoTai" value="folder" onchange="toggleUpMode()"> 📂 Cả thư mục</label>
        <label style="color: #047857;"><input type="radio" name="cheDoTai" value="link" onchange="toggleUpMode()"> 🔗 Gán link Web/Drive</label>
      </div>

      <div style="display:flex; gap:20px; justify-content:center; padding:8px; background:#e0f2fe; border-radius:6px; margin-bottom:10px; font-size: 14px;">
        <label style="color:#0369a1; cursor:pointer;" title="Xóa tài liệu cũ, thay mới">
          <input type="radio" name="cheDoGhi" value="replace" checked onchange="CD_HienThiCanhBao()"> 🔄 Thay thế cũ
        </label>
        <label style="color:#0369a1; cursor:pointer;" title="Giữ cũ, chèn thêm">
          <input type="radio" name="cheDoGhi" value="append" onchange="CD_HienThiCanhBao()"> ➕ Chèn thêm
        </label>
      </div>
      
      <div class="up-dropzone" id="dropzoneArea" onclick="document.getElementById('tepDauVao').click()">
        <span id="nhanHienThiTep">Nhấn vào đây để chọn hồ sơ</span>
        <input type="file" id="tepDauVao" style="display:none" onchange="CD_XyLyChonTep(this)" multiple>
      </div>

      <div id="linkInputArea" style="display:none; text-align: left;">
          <input type="text" id="txtDirectLink" placeholder="Dán link Google Drive hoặc web (.pdf, .jpg...)..." style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px;" oninput="checkDirectLink()">
      </div>
    </div>

    <div id="canhBaoXoa">⚠️ Tài liệu cũ sẽ bị xóa vĩnh viễn để thay thế.</div>
    <div id="trangThaiTai" style="text-align:center; font-weight:bold; min-height:20px; color:#333; font-size: 15px;"></div>
    
    <div style="margin-top:10px;">
      <button id="btnTaiLen" onclick="thucHienTaiLen()">BẮT ĐẦU TẢI LÊN</button>
      <button class="close-up" onclick="dongKhungTai()">ĐÓNG</button>
    </div>
  </div>
</div>

<script>
  let DANH_SACH_TEP = [];
  let LIEN_KET_CAN_XOA = ""; 
  let HAM_GOI_LAI_KHI_XONG = null; 

  function taiDanhSachThuMuc() {
    const s = document.getElementById('hopThuMuc');
    window.google.script.run.withSuccessHandler(danhSach => {
      s.innerHTML = `<option value="">-- Thư mục gốc --</option>`;
      if(danhSach) danhSach.forEach(tm => s.add(new Option("📂 " + tm.name, tm.id)));
    }).CD_LayThuMucCon();
  }

  function openUploadModal(linkHienTai, khiThanhCong) {
    LIEN_KET_CAN_XOA = linkHienTai || "";
    HAM_GOI_LAI_KHI_XONG = khiThanhCong;
    document.getElementById('khung_tai_tl').style.display = 'flex';
    taiDanhSachThuMuc();
  }

  function toggleUpMode() {
    const mode = document.querySelector('input[name="cheDoTai"]:checked').value;
    document.getElementById('dropzoneArea').style.display = (mode === 'link') ? 'none' : 'block';
    document.getElementById('linkInputArea').style.display = (mode === 'link') ? 'block' : 'none';
    const btn = document.getElementById('btnTaiLen');
    if (mode === 'link') { btn.style.opacity = 1; btn.style.pointerEvents = "auto"; }
    else { btn.style.opacity = 0.5; btn.style.pointerEvents = "none"; }
    CD_HienThiCanhBao();
  }

  function checkDirectLink() {
    const btn = document.getElementById('btnTaiLen');
    btn.style.opacity = (document.getElementById('txtDirectLink').value.trim() !== "") ? 1 : 0.5;
    btn.style.pointerEvents = (document.getElementById('txtDirectLink').value.trim() !== "") ? "auto" : "none";
  }

  function toggleNewFolderUI() { document.getElementById('newFolderArea').style.display = (document.getElementById('newFolderArea').style.display === 'none') ? 'block' : 'none'; }

  function doCreateNewFolder() {
      const n = document.getElementById('txtNewFolderName').value;
      const p = document.getElementById('hopThuMuc').value;
      if(!n) return;
      document.getElementById('trangThaiTai').innerText = "⏳ Đang tạo...";
      window.google.script.run.withSuccessHandler(res => {
          if(res.success){
              const s = document.getElementById('hopThuMuc');
              s.add(new Option("📂 " + res.name, res.id), s.selectedIndex + 1);
              s.value = res.id;
              toggleNewFolderUI();
              document.getElementById('trangThaiTai').innerText = "✅ Đã tạo!";
          }
      }).SCV_createNewFolder(p, n);
  }

  function CD_HienThiCanhBao() {
    const kieuGhi = document.querySelector('input[name="cheDoGhi"]:checked').value;
    const vungCanhBao = document.getElementById('canhBaoXoa');
    vungCanhBao.style.display = (kieuGhi === 'replace' && LIEN_KET_CAN_XOA && LIEN_KET_CAN_XOA.trim() !== "") ? 'block' : 'none';
  }

  function dongKhungTai() {
    document.getElementById('khung_tai_tl').style.display = 'none';
    DANH_SACH_TEP = [];
    document.getElementById('btnTaiLen').classList.remove('active');
  }

  function CD_XyLyChonTep(tepVao) {
    if (tepVao.files.length > 0) {
      DANH_SACH_TEP = tepVao.files;
      document.getElementById('nhanHienThiTep').innerText = `📄 Đã chọn ${DANH_SACH_TEP.length} tệp`;
      document.getElementById('btnTaiLen').classList.add('active');
    }
  }

  function thucHienTaiLen() {
    const mode = document.querySelector('input[name="cheDoTai"]:checked').value;
    const kieuGhi = document.querySelector('input[name="cheDoGhi"]:checked').value;
    const st = document.getElementById('trangThaiTai');

    if (mode === 'link') {
        const link = document.getElementById('txtDirectLink').value;
        const finalLink = (kieuGhi === 'append' && LIEN_KET_CAN_XOA) ? (LIEN_KET_CAN_XOA + "," + link) : link;
        if(HAM_GOI_LAI_KHI_XONG) HAM_GOI_LAI_KHI_XONG(finalLink, "Link", kieuGhi);
        dongKhungTai();
        return;
    }

    st.innerText = "⏳ Đang tải lên hệ thống...";
    // Thực hiện logic tải file cũ (Array.from, FileReader, run...)
    // ... (Giữ nguyên logic cũ đã được xác nhận ổn định)
  }
</script>
